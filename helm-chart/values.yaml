backend:
  image: ghcr.io/kakarot-dev/deepmiro-backend:latest
  imagePullPolicy: Always
  port: 5001
  resources:
    # IMPORTANT — the production node (jenny) has only ~11 GiB of
    # physical RAM. Limits must SUM to less than that across every
    # container, or the kernel OOM-killer fires under load and kills
    # a victim (exitCode 137). A prior "fix" raised this to 8Gi —
    # that made it worse: an 8Gi limit + twhin 2.5Gi + surreal 2Gi +
    # mcp/hosted = ~13.9Gi of limits on an 11Gi box (116% over).
    # Raising a limit does not add RAM; it just lets one container
    # starve the others.
    #
    # Right-sized so the SUM of all container limits stays ~10Gi
    # (1Gi left for the OS). The backend idles at ~1.8Gi and peaks
    # ~3Gi during report generation; 4Gi is safe headroom for a
    # couple of concurrent sims. Running 3-4 concurrent sims needs a
    # bigger node — that is a VPS-upgrade conversation, not a
    # limit-bump one.
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "3000m"

twhinSidecar:
  # Pod-scoped TWHIN-BERT embedding service. Loads the model exactly
  # once per pod regardless of how many sim subprocesses are running.
  # Listens on localhost:7001, only reachable from inside the pod.
  #
  # NOTE: this container shares the pod's Ready condition — when it
  # OOM-dies and restarts, the WHOLE pod goes NotReady, the backend
  # Service drops it from endpoints, and every request 502s until
  # the model reloads. So keeping it inside its memory budget is
  # load-bearing for backend availability, not just for embeddings.
  image: ghcr.io/kakarot-dev/deepmiro-twhin-sidecar:latest
  imagePullPolicy: Always
  port: 7001
  resources:
    # Model weights (~1.5 GiB) + tokenizer cache + batch headroom.
    # It was the OOM victim at the old 2500Mi cap (node-pressure
    # kill, reason=Error not OOMKilled), so give it a little more.
    requests:
      memory: "1500Mi"
      cpu: "200m"
    limits:
      memory: "3Gi"
      cpu: "1000m"

mcp:
  image: ghcr.io/kakarot-dev/deepmiro-mcp:latest
  port: 3001
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

surrealdb:
  image: surrealdb/surrealdb:latest
  port: 8000
  storage: 20Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Set hosted.enabled=true when using deepmiro-hosted overlay (auth, billing, edge)
# When enabled, /api traffic routes through the hosted pod instead of directly to backend
hosted:
  enabled: false

ingress:
  enabled: true
  host: deepmiro.org
  className: traefik

llm:
  baseUrl: "https://api.fireworks.ai/inference/v1"
  modelName: "accounts/fireworks/models/minimax-m2p5"
  boostModelName: "accounts/fireworks/models/gpt-oss-120b"

embedding:
  baseUrl: "https://api.fireworks.ai/inference"
  model: "nomic-ai/nomic-embed-text-v1.5"
  dimensions: 768

uploads:
  storage: 20Gi
